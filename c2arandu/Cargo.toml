[package]
name = "c2arandu"
version = "0.1.0"
edition = "2021"
description = "Transpilador de código C para Arandu seguro e idiomático com suporte a Dual-Locus"

[dependencies]
clang-sys = { version = "1", features = ["clang_16_0"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"

[[bin]]
name = "c2arandu"
path = "src/main.rs"
